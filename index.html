<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ℕ𝕩-𝕖𝕕𝕚𝕥𝕠𝕣</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0d0f14">
<style>
:root{--bg:#0e0e11;--p:#17181c;--p2:#1e2027;--p3:#262830;--b:#2a2d36;--bh:#3a3e4a;--t:#e6e7ea;--m:#9ea3b0;--m2:#63687a;--a:#6366f1;--ah:#7c7ff5;--ac:#fff;--glow:0 0 0 3px rgba(99,102,241,.18);--ck1:#1b1c21;--ck2:#24262c;--r:10px;--rs:6px;--s2:0 4px 12px rgba(0,0,0,.4);--s3:0 8px 24px rgba(0,0,0,.5);--tf:120ms cubic-bezier(.4,0,.2,1)}
[data-theme=light]{--bg:#e9ebf0;--p:#fff;--p2:#f3f4f8;--p3:#e6e8ef;--b:#d9dce5;--bh:#b9bece;--t:#1b1e29;--m:#5d6475;--m2:#9097a8;--a:#4f46e5;--ah:#6366f1;--glow:0 0 0 3px rgba(79,70,229,.18);--ck1:#d4d7df;--ck2:#fff;--s2:0 4px 12px rgba(20,20,40,.15);--s3:0 8px 24px rgba(20,20,40,.2)}
[data-theme=neon]{--bg:#06010f;--p:#0e0620;--p2:#170a33;--p3:#22104a;--b:#3b1a7a;--bh:#6a35c9;--t:#f2e8ff;--m:#a98cdc;--m2:#7a5fb0;--a:#00f0ff;--ah:#5ff6ff;--ac:#001016;--glow:0 0 12px rgba(0,240,255,.5);--ck1:#150a30;--ck2:#22104a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--t);font:13px/1.4 "Segoe UI",system-ui,"IBM Plex Sans Arabic",Tahoma,sans-serif;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}svg{display:block;margin:auto;flex:none}
button{cursor:pointer;background:var(--p2);border:1px solid var(--b);border-radius:var(--rs);padding:5px 10px;font-size:12px;transition:var(--tf)}
button:hover{background:var(--p3);border-color:var(--bh)}button:disabled{opacity:.35;pointer-events:none}
.ib{background:transparent;border:0;padding:6px;border-radius:var(--rs);display:grid;place-items:center;color:var(--m)}.ib:hover{background:var(--p3);color:var(--t)}.ib.on{color:var(--a)}
.pri{background:var(--a);border-color:var(--a);color:var(--ac);display:flex;gap:6px;align-items:center}.pri:hover{background:var(--ah);border-color:var(--ah)}
.flip svg{transform:scaleX(-1)}.sp{flex:1}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--p3);color:var(--t);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;pointer-events:none;box-shadow:var(--s2);border:1px solid var(--b);z-index:200}
.tool[data-tip]:hover::after{top:50%;left:calc(100% + 8px);transform:translateY(-50%)}
#status [data-tip]:hover::after{top:auto;bottom:calc(100% + 6px)}
#top{height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--b);flex:none}
#logo{font-size:15px;color:var(--t);margin-inline-end:8px;white-space:nowrap}#logo b{color:var(--a)}
#menubar{display:flex;gap:2px}#menubar button{background:none;border:0;color:var(--m);padding:5px 9px}#menubar button:hover,#menubar button.on{background:var(--p3);color:var(--t)}
#dn{margin-inline-start:12px;color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm{display:none}
#mid{flex:1;display:flex;min-height:0;direction:ltr}
#toolbar{width:48px;flex:none;background:var(--p);border-right:1px solid var(--b);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.tool{width:36px;height:36px;flex:none;border:0;background:transparent;color:var(--m);border-radius:var(--rs);display:grid;place-items:center;padding:0}
.tool:hover{background:var(--p3);color:var(--t)}.tool.on{background:var(--a);color:var(--ac);box-shadow:var(--glow)}
.sep{height:1px;width:26px;background:var(--b);margin:5px 0;flex:none}
#stage{flex:1;position:relative;min-width:0}
#area{position:absolute;inset:0;overflow:auto;display:flex;direction:ltr;padding:28px;background:var(--bg)}
#wrap{margin:auto;flex:none;position:relative;box-shadow:0 0 0 1px var(--b),var(--s3);background:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/16px 16px}
#wrap canvas{display:block}#ov{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}
#settings{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px;z-index:5;direction:rtl}
#panel{width:292px;flex:none;background:var(--p);border-left:1px solid var(--b);overflow-y:auto;direction:rtl;display:flex;flex-direction:column}
#phandle{display:none}
.pg{padding:10px 12px;border-bottom:1px solid var(--b)}
#ptitle{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12px;margin-bottom:8px;letter-spacing:-.01em}#ptitle svg{margin:0;color:var(--a)}
#opts{display:flex;flex-direction:column;gap:8px}
.clr{display:flex;align-items:center;gap:8px}.sw2{position:relative;width:46px;height:34px}
.sw2 input{position:absolute;width:26px;height:26px;padding:0;border:2px solid var(--p);border-radius:var(--rs);box-shadow:0 0 0 1px var(--b);background:none;cursor:pointer}
.sw2 .fgc{left:0;top:0;z-index:2}.sw2 .bgc{right:0;bottom:0}
.hint{color:var(--m2);font-size:12px}
.o{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--m)}.o>span{display:flex;justify-content:space-between;align-items:center}.o b{color:var(--t);font-weight:500;font-variant-numeric:tabular-nums}
.o.sw{flex-direction:row;justify-content:space-between;align-items:center}
select,dialog input:not([type=checkbox]):not([type=range]):not([type=color]),dialog textarea{background:var(--p2);border:1px solid var(--b);border-radius:var(--rs);padding:5px 7px;color:var(--t)}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:var(--glow)}
input[type=color]{width:34px;height:30px;padding:0;border:2px solid var(--b);border-radius:var(--rs);background:none;cursor:pointer}
.seg{display:flex;background:var(--p2);border-radius:8px;padding:2px;gap:2px}.seg button{flex:1;border:0;background:transparent;padding:4px 6px;color:var(--m)}.seg button.on{background:var(--p3);color:var(--a);box-shadow:0 1px 2px rgba(0,0,0,.3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;direction:ltr;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--a) var(--fill,0%),var(--p3) var(--fill,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--a);box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform var(--tf)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--p3)}input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--a)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--a)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;width:32px;height:18px;border-radius:9px;background:var(--p3);border:0;margin:0 0 0 6px;cursor:pointer;flex:none;vertical-align:middle;transition:var(--tf)}
input[type=checkbox]::before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff;transition:var(--tf)}
input[type=checkbox]:checked{background:var(--a)}input[type=checkbox]:checked::before{transform:translateX(14px)}
.ptabs{display:flex;position:sticky;top:0;z-index:3;background:var(--p);border-bottom:1px solid var(--b);flex:none}
.pt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;border:0;background:none;color:var(--m);padding:7px 0 6px;border-radius:0}
.pt:hover{background:none;color:var(--t)}.pt.on{color:var(--a);box-shadow:inset 0 -2px 0 var(--a)}
#sb{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;padding:10px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:8px 2px}
.tabs{display:flex;gap:2px;margin:10px 12px 0;background:var(--p2);border-radius:8px;padding:2px}.tabs button{flex:1;border:0;background:transparent;color:var(--m);padding:4px 2px}.tabs .on{background:var(--p3);color:var(--a)}
.pd{padding:6px 12px}.sl{display:block;font-size:12px;color:var(--m);margin:7px 0}.sl span{display:flex;justify-content:space-between}.sl b{color:var(--t);font-weight:500}
.ar{display:flex;gap:6px;padding:10px 12px}.ar button{flex:1}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chip.on{border-color:var(--a);color:var(--a)}
.g2{display:flex;gap:10px}.g2>*{flex:1}
.lbar{display:flex;align-items:center;gap:2px;padding:2px 10px 6px;border-bottom:1px solid var(--b)}
.lst{padding:6px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;border-radius:var(--rs);cursor:pointer;background:transparent}
.row:hover{background:var(--p2)}.row.on{background:var(--p2);border-color:var(--a)}.row.off .nm{opacity:.45}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{font-size:10px;color:var(--m)}
.row canvas{width:40px;height:28px;border-radius:3px;border:1px solid var(--b);flex:none;background:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/8px 8px}
.row canvas.tm{background:#000}.row canvas.ed{border-color:var(--a);box-shadow:var(--glow)}
.eye,.lkb{background:none;border:0;padding:2px;color:var(--m);display:grid}.eye:hover,.lkb:hover{background:none;color:var(--t)}.lkb:not(.on){opacity:0}.row:hover .lkb{opacity:1}.lkb.on{color:var(--a)}
.rn{width:100%;padding:3px 5px}
.sws{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:8px 12px 12px}.sws button{aspect-ratio:1;padding:0;border-radius:5px}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin:0 auto 12px;max-width:560px}.card h4{margin:0 0 10px;color:var(--a)}
label.f{display:block;font-size:12px;color:var(--m);margin:8px 0}label.f input,label.f select,label.f textarea{width:100%;margin-top:3px}label.ck{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:13px}
dialog{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:16px;width:min(380px,92vw);box-shadow:var(--s3);direction:rtl}dialog::backdrop{background:#000a}
dialog h3{margin:0 0 10px;color:var(--a);font-size:14px}dialog .ar{padding:12px 0 0}
#status{height:26px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--p);border-top:1px solid var(--b);font-size:11px;color:var(--m)}
#status .ib{padding:2px}#st,#xy{direction:ltr;font-variant-numeric:tabular-nums}#zl{min-width:38px;text-align:center;direction:ltr}#sig{color:var(--m2)}
#ctx{position:fixed;z-index:300;min-width:190px;background:var(--p);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--s3);padding:4px;direction:rtl;max-height:80vh;overflow:auto}
#ctx button{display:flex;width:100%;justify-content:space-between;gap:16px;border:0;background:none;padding:6px 10px;text-align:start}#ctx button:hover{background:var(--a);color:var(--ac)}#ctx small{color:var(--m2);direction:ltr}#ctx button:hover small{color:inherit}
#ctx hr{border:0;border-top:1px solid var(--b);margin:4px 0}.mh{padding:6px 10px 2px;font-size:10px;color:var(--a);font-weight:600}
#pal{position:fixed;inset:0;background:#0008;z-index:400;display:flex;justify-content:center;padding-top:12vh;direction:rtl}
.pbox{width:min(520px,92vw);height:max-content;background:var(--p);border:1px solid var(--b);border-radius:14px;box-shadow:var(--s3);overflow:hidden}
#pin{width:100%;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:12px 14px;font-size:14px;background:transparent}#pin:focus{box-shadow:none}
#pls{max-height:50vh;overflow:auto;padding:4px}#pls button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:7px 10px}#pls button.on,#pls button:hover{background:var(--a);color:var(--ac)}#pls small{opacity:.7;direction:ltr}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--bh);padding:7px 16px;border-radius:20px;z-index:99;box-shadow:var(--s2);pointer-events:none}
@media(max-width:760px){
 #menubar,#dn,.tool[data-tip]::after{display:none!important}#status>*:not(#sig){display:none!important}#status{height:22px;justify-content:center}#phandle{order:-2}.ptabs{order:-1}.mm{display:grid}#logo{margin-inline-end:auto}
 #mid{flex-direction:column}#toolbar{width:100%;height:46px;flex-direction:row;border-right:0;border-bottom:1px solid var(--b);padding:0 6px;overflow-x:auto;overflow-y:hidden}
 .sep{width:1px;height:24px;margin:0 4px}
 #panel{width:100%;max-height:42vh;border-left:0;border-top:1px solid var(--b);transition:max-height 200ms}
 #panel.col{max-height:34px;overflow:hidden}#phandle{display:grid;width:100%;height:34px;flex:none;border:0;background:var(--p);border-radius:0;color:var(--m)}
 #area{padding:12px}
}
#panel::-webkit-scrollbar,#sb::-webkit-scrollbar,#area::-webkit-scrollbar,#ctx::-webkit-scrollbar{width:8px;height:8px}
#panel::-webkit-scrollbar-thumb,#area::-webkit-scrollbar-thumb,#ctx::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}#panel::-webkit-scrollbar-thumb:hover,#area::-webkit-scrollbar-thumb:hover{background:var(--bh)}#area::-webkit-scrollbar-corner{background:transparent}
#panel,#area{scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.row.dt{box-shadow:0 -2px 0 var(--a)}.ii{display:inline-flex;vertical-align:middle;margin-inline-end:4px}.ii svg{margin:0}
.chip{display:inline-flex;gap:6px;align-items:center}.ar button{display:flex;gap:6px;justify-content:center;align-items:center}.ar button svg{margin:0}
dialog input[type=color]{width:100%;height:38px}
#ptitle,.mh{font-weight:700;letter-spacing:.02em}
@media(min-width:1200px){.tool{width:40px;height:40px}#toolbar{width:52px}}
@media(max-width:760px){.tool{width:44px;height:44px}#toolbar{height:54px}}

/* ===== حركات وتأثيرات ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideT{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-8px)}}
@keyframes rowIn{from{opacity:0;transform:translateX(18px);background:var(--a)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes shine{to{background-position:200% 0}}
@keyframes neon{0%,100%{box-shadow:0 0 6px rgba(0,240,255,.45)}50%{box-shadow:0 0 16px rgba(0,240,255,.9)}}
@keyframes flash{0%{color:var(--a);transform:scale(1.08)}100%{color:var(--m);transform:none}}
@keyframes tipIn{from{opacity:0}to{opacity:1}}
#top{animation:slideT .45s cubic-bezier(.2,.8,.2,1) both}#status{animation:fade .6s .3s both}
#toolbar{animation:slideL .5s cubic-bezier(.2,.8,.2,1) both}#panel{animation:slideR .5s cubic-bezier(.2,.8,.2,1) both}
#wrap{animation:scaleIn .55s .12s cubic-bezier(.2,.8,.2,1) both}
.tool{animation:pop .4s calc(var(--i)*22ms + .15s) cubic-bezier(.34,1.56,.64,1) both;transition:background var(--tf),color var(--tf),transform var(--tf),box-shadow var(--tf)}
.tool:hover{transform:translateY(-1px) scale(1.06)}.tool:active{transform:scale(.9)}
.tool.on{animation:none;transform:none}.tool.on svg{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
[data-theme=neon] .tool.on,[data-theme=neon] .pri{animation:neon 2.2s ease-in-out infinite}
#logo b{background:linear-gradient(90deg,var(--a),#c4b5fd,var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
[data-theme=neon] #logo b{background-image:linear-gradient(90deg,#00f0ff,#ff2bd6,#00f0ff)}
button{transition:background var(--tf),border-color var(--tf),color var(--tf),transform var(--tf),box-shadow var(--tf)}
button:active:not(:disabled){transform:scale(.96)}.ib:active svg{transform:scale(.82)}.ib svg{transition:transform var(--tf)}
@media (pointer:coarse){.ib{min-width:44px;min-height:44px}.chip,.brow button,.row2 button,#sb button{min-height:40px}#sb .row{min-height:48px}input[type=range]{min-height:32px}}
#un:active svg{transform:rotate(-35deg) scale(.9)}#re:active svg{transform:scaleX(-1) rotate(-35deg) scale(.9)}#gear:hover svg{transform:rotate(60deg)}#gear svg{transition:transform .35s}
.pri,.pt,.chip,.tb{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.pri::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28),transparent 70%);transform:translateX(-130%);pointer-events:none}
.pri:hover::before{transform:translateX(130%);transition:transform .7s}
.pt.on{box-shadow:none}.ptabs{position:sticky}#tind{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--a);border-radius:2px;transition:left .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--a)}
.pt svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}.pt.on svg{transform:translateY(-1px) scale(1.12)}
#sb,#ptitle,#opts{animation:fadeUp .24s cubic-bezier(.2,.8,.2,1) both}
.row{transition:background var(--tf),border-color var(--tf),box-shadow var(--tf),transform var(--tf),opacity var(--tf)}.row:hover{transform:translateX(-2px)}.row.rin{animation:rowIn .45s cubic-bezier(.2,.8,.2,1)}
.row.maskmode{background:rgba(99,102,241,.1)}.row.maskmode .nm::after{content:' · قناع';color:var(--a);font-size:10px}
.seg button{transition:all var(--tf)}.seg button.on{animation:pop .25s}
input[type=checkbox]::before{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
input[type=range]::-webkit-slider-thumb{transition:transform var(--tf),box-shadow var(--tf)}input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35);box-shadow:0 0 0 6px rgba(99,102,241,.2)}
#ctx{animation:popIn .15s cubic-bezier(.2,.9,.3,1.2);transform-origin:top}#ctx button{transition:background var(--tf),padding var(--tf)}#ctx button:hover{padding-inline-start:14px}
#pal{animation:fade .18s both;backdrop-filter:blur(4px)}.pbox{animation:dropIn .25s cubic-bezier(.2,.9,.3,1.15) both}
dialog[open]{animation:scaleIn .22s cubic-bezier(.2,.9,.3,1.1)}dialog::backdrop{backdrop-filter:blur(4px);animation:fade .2s both}
#toast{animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2) both}#toast.out{animation:toastOut .22s forwards}
#settings:not([hidden]){animation:fadeUp .3s cubic-bezier(.2,.8,.2,1)}.card{animation:fadeUp .4s both}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:10px}.kr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--m)}.kr input{width:34px;text-align:center;text-transform:uppercase;background:var(--p2);border:1px solid var(--b);border-radius:var(--rs);padding:4px;color:var(--t)}
